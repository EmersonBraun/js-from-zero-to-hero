<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Challenge 1</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 Pokédex</h1>
            <p>Advanced Pokémon database with search and filtering</p>
        </div>

        <div class="search-section">
            <div class="search-bar">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search Pokémon by name or number..."
                >
                <button class="btn search-btn" id="searchBtn">🔍</button>
            </div>
            
            <div class="filters">
                <div class="filter-group">
                    <label for="typeFilter">Type:</label>
                    <select id="typeFilter">
                        <option value="">All Types</option>
                        <option value="normal">Normal</option>
                        <option value="fire">Fire</option>
                        <option value="water">Water</option>
                        <option value="electric">Electric</option>
                        <option value="grass">Grass</option>
                        <option value="ice">Ice</option>
                        <option value="fighting">Fighting</option>
                        <option value="poison">Poison</option>
                        <option value="ground">Ground</option>
                        <option value="flying">Flying</option>
                        <option value="psychic">Psychic</option>
                        <option value="bug">Bug</option>
                        <option value="rock">Rock</option>
                        <option value="ghost">Ghost</option>
                        <option value="dragon">Dragon</option>
                        <option value="dark">Dark</option>
                        <option value="steel">Steel</option>
                        <option value="fairy">Fairy</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="sortBy">Sort by:</label>
                    <select id="sortBy">
                        <option value="id">Number</option>
                        <option value="name">Name</option>
                        <option value="height">Height</option>
                        <option value="weight">Weight</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <label for="viewMode">View:</label>
                    <select id="viewMode">
                        <option value="grid">Grid</option>
                        <option value="list">List</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn secondary-btn" id="randomBtn">🎲 Random Pokémon</button>
            <button class="btn secondary-btn" id="favoritesBtn">⭐ Favorites</button>
            <button class="btn secondary-btn" id="compareBtn">⚖️ Compare</button>
        </div>

        <div class="pokemon-grid" id="pokemonGrid">
            <!-- Pokémon cards will be populated here -->
        </div>

        <div class="pagination">
            <button class="btn pagination-btn" id="prevBtn">← Previous</button>
            <span class="page-info" id="pageInfo">Page 1 of 50</span>
            <button class="btn pagination-btn" id="nextBtn">Next →</button>
        </div>

        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Loading Pokémon...</p>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
