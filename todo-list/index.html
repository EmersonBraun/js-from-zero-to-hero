<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO List</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>TODO List</h1>
        
        <div class="add-task">
            <input type="text" id="taskInput" class="task-input" placeholder="Add a new task...">
            <button id="addBtn" class="add-btn">Add</button>
        </div>
        
        <div class="filters">
            <button id="allBtn" class="filter-btn active">All</button>
            <button id="activeBtn" class="filter-btn">Active</button>
            <button id="completedBtn" class="filter-btn">Completed</button>
        </div>
        
        <div class="stats">
            <span id="totalTasks">0 tasks</span>
            <span id="completedTasks">0 completed</span>
        </div>
        
        <div class="task-list" id="taskList">
            <!-- Tasks will be added here dynamically -->
        </div>
        
        <div class="row">
            <div class="btn-group">
                <button id="clearCompletedBtn" class="btn">Clear Completed</button>
                <button id="clearAllBtn" class="btn">Clear All</button>
            </div>
        </div>
        
        <div class="row">
            <div class="navigation">
                <a href="challenge-1/index.html" class="btn">Challenge 1</a>
                <a href="challenge-2/index.html" class="btn">Challenge 2</a>
            </div>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
