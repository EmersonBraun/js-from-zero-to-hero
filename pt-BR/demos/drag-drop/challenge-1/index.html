<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop - Challenge 1</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>Drag and Drop</h1>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-content">
                <div class="upload-icon">📁</div>
                <h3>Drag and drop files here</h3>
                <p>or click to browse files</p>
                <input type="file" id="fileInput" multiple accept="image/*,.pdf,.doc,.docx,.txt" style="display: none;">
                <button class="btn browse-btn" onclick="document.getElementById('fileInput').click()">
                    Browse Files
                </button>
            </div>
        </div>
        
        <div class="file-info" id="fileInfo">
            <h3>File Information</h3>
            <div class="info-grid" id="infoGrid">
                <!-- File info will be displayed here -->
            </div>
        </div>
        
        <div class="preview-area" id="previewArea">
            <h3>File Previews</h3>
            <div class="preview-grid" id="previewGrid">
                <!-- File previews will be displayed here -->
            </div>
        </div>
        
        <div class="row">
            <div class="btn-group">
                <button id="clearBtn" class="btn">Clear All</button>
                <button id="downloadBtn" class="btn">Download All</button>
            </div>
        </div>
        
        <div class="row">
            <div class="navigation">
                <a href="../index.html" class="btn">Back to Class</a>
                <a href="challenge-2/index.html" class="btn">Challenge 2</a>
            </div>
        </div>
        
        <!-- Status Messages -->
        <div class="status-messages" id="statusMessages">
            <!-- Status messages will appear here -->
        </div>
    </div>
    
    <!-- File Preview Modal -->
    <div id="previewModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <div class="modal-body" id="modalBody">
                <!-- Preview content will be displayed here -->
            </div>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
