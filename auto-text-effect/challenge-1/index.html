<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Text Effect - Challenge 1</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>Auto Text Effect</h1>
        
        <div class="text-display">
            <div class="text-content" id="textContent"></div>
            <div class="cursor" id="cursor">|</div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label for="speedSlider">Typing Speed (WPM):</label>
                <input type="range" id="speedSlider" min="1" max="50" value="20" class="slider">
                <span id="speedValue">20 WPM</span>
            </div>
            
            <div class="control-group">
                <label for="customInput">Custom Text:</label>
                <textarea id="customInput" class="input" placeholder="Enter your own text here..." rows="3"></textarea>
                <button id="customBtn" class="btn">Set Custom Text</button>
            </div>
        </div>
        
        <div class="text-selector" id="textSelector">
            <!-- Text options will be populated by JavaScript -->
        </div>
        
        <div class="row">
            <div class="btn-group">
                <button id="playBtn" class="btn">Play</button>
                <button id="pauseBtn" class="btn" disabled>Pause</button>
                <button id="resetBtn" class="btn" disabled>Reset</button>
            </div>
        </div>
        
        <div class="statistics">
            <h3>Statistics</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">Characters:</span>
                    <span class="stat-value" id="charactersTyped">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Words:</span>
                    <span class="stat-value" id="wordsTyped">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Time:</span>
                    <span class="stat-value" id="timeElapsed">0s</span>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="navigation">
                <a href="../index.html" class="btn">Main Project</a>
                <a href="../challenge-2/index.html" class="btn">Challenge 2</a>
            </div>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
