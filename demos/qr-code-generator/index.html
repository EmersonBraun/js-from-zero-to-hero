<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>QR Code Generator</h1>
        
        <div class="row">
            <input type="text" id="textInput" class="input" placeholder="Enter text or URL to generate QR code">
        </div>
        
        <div class="row">
            <div class="btn-group">
                <button id="generateBtn" class="btn">Generate QR Code</button>
                <button id="clearBtn" class="btn">Clear</button>
            </div>
        </div>
        
        <div class="row">
            <div id="qrCodeContainer" class="qr-container">
                <div id="qrCode" class="qr-code"></div>
            </div>
        </div>
        
        <div class="row">
            <div class="navigation">
                <a href="challenge-1/index.html" class="btn">Challenge 1</a>
                <a href="challenge-2/index.html" class="btn">Challenge 2</a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
