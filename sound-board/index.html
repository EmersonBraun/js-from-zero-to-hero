<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Board</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>Sound Board</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="volumeControl">Master Volume:</label>
                <input type="range" id="volumeControl" min="0" max="100" value="50" class="slider">
                <span id="volumeValue">50%</span>
            </div>
            
            <div class="control-group">
                <label for="categorySelect">Category:</label>
                <select id="categorySelect" class="input">
                    <option value="all">All Sounds</option>
                    <option value="nature">Nature</option>
                    <option value="instruments">Instruments</option>
                    <option value="effects">Sound Effects</option>
                    <option value="animals">Animals</option>
                </select>
            </div>
        </div>
        
        <div class="sound-grid" id="soundGrid">
            <!-- Sound buttons will be added here dynamically -->
        </div>
        
        <div class="row">
            <div class="btn-group">
                <button id="stopAllBtn" class="btn">Stop All</button>
                <button id="randomBtn" class="btn">Random Sound</button>
                <button id="loopBtn" class="btn">Toggle Loop</button>
            </div>
        </div>
        
        <div class="row">
            <div class="navigation">
                <a href="challenge-1/index.html" class="btn">Challenge 1</a>
                <a href="challenge-2/index.html" class="btn">Challenge 2</a>
            </div>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
