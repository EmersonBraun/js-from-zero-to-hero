<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing App</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>Drawing App</h1>
        
        <div class="toolbar">
            <div class="tool-group">
                <label for="brushSize">Brush Size:</label>
                <input type="range" id="brushSize" min="1" max="50" value="5" class="slider">
                <span id="brushSizeValue">5px</span>
            </div>
            
            <div class="tool-group">
                <label for="brushColor">Color:</label>
                <input type="color" id="brushColor" value="#000000" class="color-picker">
            </div>
            
            <div class="tool-group">
                <label for="brushOpacity">Opacity:</label>
                <input type="range" id="brushOpacity" min="1" max="100" value="100" class="slider">
                <span id="opacityValue">100%</span>
            </div>
        </div>
        
        <div class="drawing-tools">
            <button id="brushTool" class="tool-btn active" title="Brush Tool">
                🖌️
            </button>
            <button id="eraserTool" class="tool-btn" title="Eraser">
                🧽
            </button>
            <button id="lineTool" class="tool-btn" title="Line Tool">
                📏
            </button>
            <button id="rectangleTool" class="tool-btn" title="Rectangle">
                ⬜
            </button>
            <button id="circleTool" class="tool-btn" title="Circle">
                ⭕
            </button>
            <button id="textTool" class="tool-btn" title="Text Tool">
                T
            </button>
            <button id="fillTool" class="tool-btn" title="Fill Tool">
                🎨
            </button>
            <button id="eyedropperTool" class="tool-btn" title="Eyedropper">
                👁️
            </button>
        </div>
        
        <div class="canvas-container">
            <canvas id="drawingCanvas" width="800" height="600"></canvas>
            <div class="canvas-overlay" id="canvasOverlay"></div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label for="canvasWidth">Canvas Width:</label>
                <input type="number" id="canvasWidth" class="input" value="800" min="100" max="2000">
            </div>
            
            <div class="control-group">
                <label for="canvasHeight">Canvas Height:</label>
                <input type="number" id="canvasHeight" class="input" value="600" min="100" max="2000">
            </div>
            
            <div class="control-group">
                <label for="backgroundColor">Background:</label>
                <input type="color" id="backgroundColor" value="#ffffff" class="color-picker">
            </div>
        </div>
        
        <div class="row">
            <div class="btn-group">
                <button id="clearBtn" class="btn">Clear Canvas</button>
                <button id="undoBtn" class="btn">Undo</button>
                <button id="redoBtn" class="btn">Redo</button>
                <button id="saveBtn" class="btn">Save Image</button>
                <button id="loadBtn" class="btn">Load Image</button>
            </div>
        </div>
        
        <div class="row">
            <div class="btn-group">
                <button id="downloadBtn" class="btn">Download PNG</button>
                <button id="downloadJpgBtn" class="btn">Download JPG</button>
                <button id="shareBtn" class="btn">Share</button>
            </div>
        </div>
        
        <div class="row">
            <div class="navigation">
                <a href="challenge-1/index.html" class="btn">Challenge 1</a>
                <a href="challenge-2/index.html" class="btn">Challenge 2</a>
            </div>
        </div>
        
        <!-- Hidden file input for loading images -->
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
        
        <!-- Text input overlay -->
        <div id="textInputOverlay" class="text-input-overlay">
            <input type="text" id="textInput" placeholder="Enter text..." class="text-input">
            <div class="text-controls">
                <input type="color" id="textColor" value="#000000" class="color-picker">
                <input type="range" id="textSize" min="8" max="72" value="24" class="slider">
                <span id="textSizeValue">24px</span>
                <button id="confirmText" class="btn">Add Text</button>
                <button id="cancelText" class="btn">Cancel</button>
            </div>
        </div>
        
        <!-- Color palette -->
        <div class="color-palette">
            <h4>Color Palette</h4>
            <div class="palette-colors" id="paletteColors">
                <!-- Color swatches will be generated here -->
            </div>
        </div>
        
        <!-- Drawing history -->
        <div class="history-panel">
            <h4>Drawing History</h4>
            <div class="history-list" id="historyList">
                <!-- History items will be displayed here -->
            </div>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>
</html>
